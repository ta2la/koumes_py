<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>checks viewer</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: auto;
         background: #fafafa; color: #111827;
         font: 13px/1.55 system-ui, sans-serif; }
  #root { padding: 12px 20px; }
  .item { display: grid;
          grid-template-columns: 34px 22px minmax(200px, 320px) 60px 1fr auto;
          column-gap: 12px; align-items: baseline;
          padding: 6px 10px; margin: 2px 0;
          border-left: 4px solid transparent;
          border-radius: 3px; cursor: pointer; }
  .item:hover { background: #f1f5f9; }
  .item.selected { outline: 2px solid #3b82f6; outline-offset: -2px; }
  .item.status-ok    { border-left-color: #10b981; background: #ecfdf5; }
  .item.status-ok:hover { background: #d1fae5; }
  .item.status-issue { border-left-color: #ef4444; background: #fef2f2; }
  .item.status-issue:hover { background: #fee2e2; }
  .item.status-dead  { border-left-color: #6b7280; background: #f3f4f6; opacity: 0.65; }
  .item.status-dead:hover { background: #e5e7eb; opacity: 0.85; }
  .item.status-cpp   { border-left-color: #0284c7; background: #f0f9ff; }
  .item.status-cpp:hover { background: #e0f2fe; }
  .item.status-open  { border-left-color: #cbd5e1; background: #fff; }
  .num  { color: #6b7280; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .box  { text-align: center; font-size: 15px; cursor: default; }
  .box.has-note { cursor: help; text-decoration: underline dotted #ef4444 2px; text-underline-offset: 3px; }
  .scope { font-family: ui-monospace, monospace; font-weight: 700; color: #111827;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kind { color: #6b7280; font-size: 11px;
          text-transform: uppercase; letter-spacing: 0.05em; }
  .what { color: #374151; overflow: hidden; text-overflow: ellipsis; }
  .py   { color: #1e40af; font-family: ui-monospace, monospace; font-size: 11px;
          white-space: nowrap; }
  .cpp  { grid-column: 3 / -1; margin-top: 2px;
          color: #a16207; font-family: ui-monospace, monospace; font-size: 11px;
          padding-left: 4px; display: none; }
  body.show-cpp .cpp { display: block; }
  .header { position: sticky; top: 0; z-index: 5;
            background: rgba(250,250,250,0.96);
            border-bottom: 1px solid #e5e7eb;
            padding: 10px 20px; margin: -12px -20px 12px;
            font-weight: 700; color: #111827;
            display: flex; align-items: baseline; gap: 20px; }
  .header .stat { color: #6b7280; font-weight: 400; font-size: 12px; }
  .header .stat span { margin-right: 10px; }
  .header .toggle { margin-left: auto; font-size: 11px; color: #4b5563;
                    cursor: pointer; user-select: none; }
  .header .toggle input { vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<div id="root"><em style="color:#999; padding:1em; display:block;">načítám…</em></div>

<script>
(function () {
  const $root = document.getElementById('root');
  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  const role = params.get('role') || 'detail';
  if (!file) { $root.innerHTML = '<div style="color:#b00;padding:1em">Chybí ?file= parametr.</div>'; return; }

  let pendingLine = 0;
  let $selected = null;

  function parseT2l(text) {
    const records = [];
    let cur = null;
    for (const raw of text.split('\n')) {
      const line = raw.trim();
      if (!line) {
        if (cur && Object.keys(cur).length) records.push(cur);
        cur = null;
        continue;
      }
      if (line.startsWith('#')) continue;
      const c = line.indexOf(':');
      if (c < 0) continue;
      const k = line.slice(0, c).trim();
      let v = line.slice(c + 1).trim();
      if (!cur) cur = {};
      cur[k] = cur[k] === undefined ? v : cur[k] + '\n' + v;
    }
    if (cur && Object.keys(cur).length) records.push(cur);
    return records;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function statusIcon(s) {
    switch ((s || '').trim().toLowerCase()) {
      case 'ok':           return '✓';
      case 'issue':        return '✗';
      case 'dead':         return '✓†';
      case 'cpp_specific': return '∅';
      default:             return '☐';
    }
  }

  function statusClass(s) {
    switch ((s || '').trim().toLowerCase()) {
      case 'ok':           return 'status-ok';
      case 'issue':        return 'status-issue';
      case 'dead':         return 'status-dead';
      case 'cpp_specific': return 'status-cpp';
      default:             return 'status-open';
    }
  }

  function publishLine(n) {
    if (window.__chroma && window.__chroma.ready) {
      window.__chroma.ready.then(function (fs) {
        if (fs && fs.setSelectedLine) fs.setSelectedLine(n);
      });
    }
  }

  function selectLine(n, scroll) {
    const el = document.querySelector('.item[data-line="' + n + '"]');
    if (!el) return false;
    if ($selected) $selected.classList.remove('selected');
    el.classList.add('selected');
    $selected = el;
    if (scroll !== false) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    publishLine(n);
    return true;
  }

  function scrollToLine(n) { return selectLine(n, true); }

  function render(records) {
    const checks = records.filter(r => r.type === 'check');
    const stats = { ok: 0, issue: 0, dead: 0, cpp: 0, open: 0 };
    for (const c of checks) {
      const s = (c.status || '').trim().toLowerCase();
      if (s === 'ok') stats.ok++;
      else if (s === 'issue') stats.issue++;
      else if (s === 'dead') stats.dead++;
      else if (s === 'cpp_specific') stats.cpp++;
      else stats.open++;
    }
    $root.innerHTML = '';
    const hdr = document.createElement('div');
    hdr.className = 'header';
    hdr.innerHTML =
        '<span>Checks: ' + checks.length + '</span>'
      + '<span class="stat">'
      + '<span title="checknuto, sedí">✓ ' + stats.ok + '</span>'
      + '<span title="checknuto, nesedí">✗ ' + stats.issue + '</span>'
      + '<span title="dead code v C++, neportováno">✓† ' + stats.dead + '</span>'
      + '<span title="C++ specific (Qt/thread/macro), v py nepotrebne">∅ ' + stats.cpp + '</span>'
      + '<span title="nechecknuto">☐ ' + stats.open + '</span>'
      + '</span>'
      + '<label class="toggle"><input type="checkbox" id="cppToggle"> show cpp</label>';
    $root.appendChild(hdr);

    document.getElementById('cppToggle').addEventListener('change', function (e) {
      document.body.classList.toggle('show-cpp', e.target.checked);
    });

    checks.forEach(function (c, i) {
      const n = parseInt(c.id, 10) || (i + 1);
      const div = document.createElement('div');
      div.className = 'item ' + statusClass(c.status);
      div.dataset.line = String(n);
      const parts = [];
      parts.push('<span class="num">' + esc(c.id || '') + '</span>');
      const noteAttr = c.note
        ? ' class="box has-note" title="' + esc(c.note) + '"'
        : ' class="box"';
      parts.push('<span' + noteAttr + '>' + statusIcon(c.status) + '</span>');
      parts.push('<span class="scope" title="' + esc(c.scope || '') + '">' + esc(c.scope || '') + '</span>');
      parts.push('<span class="kind">' + esc(c.kind || '') + '</span>');
      parts.push('<span class="what">' + esc(c.what || '') + '</span>');
      parts.push('<span class="py">' + esc(c.py || '') + '</span>');
      if (c.cpp) parts.push('<div class="cpp">cpp: ' + esc(c.cpp) + '</div>');
      div.innerHTML = parts.join('');
      div.addEventListener('click', function () { selectLine(n, false); });
      $root.appendChild(div);
    });

    const urlLine = parseInt(params.get('line') || '0', 10);
    if (urlLine > 0) pendingLine = urlLine;
    if (pendingLine) {
      const n = pendingLine; pendingLine = 0;
      setTimeout(function () { scrollToLine(n); }, 100);
    }
  }

  function wireBusLineListener() {
    if (!window.__chroma || !window.__chroma.bus) return false;
    const bus = window.__chroma.bus;
    const sig = (role === 'rightmost') ? bus.lineChangedRightmost : bus.lineChanged;
    if (sig && sig.connect) {
      sig.connect(function (n) {
        if (!scrollToLine(n)) pendingLine = n;
      });
      return true;
    }
    return false;
  }
  let busTries = 0;
  (function tryWireBus() {
    if (wireBusLineListener()) return;
    if (++busTries > 50) return;
    setTimeout(tryWireBus, 100);
  })();

  window.__chromaReady = new Promise(function (resolve) {
    let tries = 0;
    (function w() {
      if (window.__chroma && window.__chroma.ready) {
        window.__chroma.ready.then(resolve);
        return;
      }
      if (++tries > 50) { resolve(null); return; }
      setTimeout(w, 100);
    })();
  });

  window.__chromaReady.then(function (fs) {
    if (!fs) {
      $root.innerHTML = '<div style="color:#b00;padding:1em">Chroma bridge nedostupný.</div>';
      return;
    }
    fs.read(file, function (text) {
      if (text == null) {
        $root.innerHTML = '<div style="color:#b00;padding:1em">fs.read vrátilo null.</div>';
        return;
      }
      render(parseT2l(text));
    });
  });
})();
</script>
</body>
</html>
