<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>redline viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
               background: #1f2937; color: #e5e7eb;
               font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #stage { position: absolute; inset: 0; display: flex;
           align-items: center; justify-content: center; overflow: hidden; }
  #holder { position: relative; line-height: 0; }
  #pic { display: block; max-width: 100%; max-height: 100%;
         user-select: none; -webkit-user-drag: none; }
  #ink { position: absolute; left: 0; top: 0; cursor: crosshair; }
  #bar { position: absolute; top: 8px; right: 8px; z-index: 5;
         display: flex; gap: 6px; align-items: center;
         background: rgba(17, 24, 39, .82); border: 1px solid #4b5563;
         border-radius: 4px; padding: 4px 6px; }
  #bar button { font: 700 11px ui-monospace, monospace; color: #e5e7eb;
                background: #374151; border: 1px solid #6b7280;
                border-radius: 3px; padding: 2px 8px; cursor: pointer; }
  #bar button:hover { background: #4b5563; color: #fff; }
  #bar button#save { background: #6d28d9; border-color: #a855f7; }
  #bar button#save:hover { background: #7c3aed; }
  /* The mode buttons are one control, so they sit flush and only the group has
     outer corners. Active mode uses the same violet as save - it is the accent
     colour of this viewer and there is no second meaning to confuse it with. */
  #modes { display: flex; margin-right: 2px; }
  #modes button { border-radius: 0; border-right-width: 0; }
  #modes button:first-child { border-radius: 3px 0 0 3px; }
  #modes button:last-child { border-radius: 0 3px 3px 0; border-right-width: 1px; }
  #modes button.on { background: #6d28d9; border-color: #a855f7; color: #fff; }
  #count { color: #c4b5fd; padding-right: 2px; }
  #hint { position: absolute; left: 8px; bottom: 8px; z-index: 5;
          color: #9ca3af; background: rgba(17, 24, 39, .82);
          border-radius: 3px; padding: 3px 7px; }
  #hint b { color: #c4b5fd; font-weight: 700; }
  #err { padding: 16px; color: #fca5a5; }
  .saving { color: #fbbf24 !important; }
</style>
</head>
<body>
<div id="bar">
  <span id="count">0</span>
  <span id="modes">
    <button id="m-rect" class="on" title="Táhni myší = obdélník">rect</button>
    <button id="m-line" title="Táhni myší = čára od ruky">line</button>
    <button id="m-poly" title="Klikej body, pravé tlačítko ukončí čáru">polyline</button>
  </span>
  <button id="undo" title="Ctrl+Z">undo</button>
  <button id="clear">clear</button>
  <button id="save" title="Export obrázku se značkami do exchange dir">save</button>
</div>
<div id="hint"></div>
<div id="stage"><div id="holder"><img id="pic" alt=""><canvas id="ink"></canvas></div></div>

<script>
(function () {
  // Marks drawn over an image. Three files, on purpose:
  //   foo.png              - the picture on disk, overwritten by save
  //   foo.png.orig         - one-time backup of the untouched original
  //   foo.png.redline.t2l  - the markup, so it can be reopened and adjusted
  // The sidecar is written on every change; the PNG only when save is pressed.
  // The background loaded into the viewer is the backup when it exists, so
  // shapes from the sidecar do not stack on top of their own baked-in copies.
  // Coordinates are stored as fractions of the image (0..1), not pixels, so a
  // markup survives a differently sized window - and stays meaningful if the
  // image itself is re-exported at another resolution. That holds for the
  // points of a line just as it does for the corners of a rectangle.
  const params = new URLSearchParams(location.search);
  const file   = params.get('file');
  const $pic   = document.getElementById('pic');
  const $ink   = document.getElementById('ink');
  const $count = document.getElementById('count');
  const $hint  = document.getElementById('hint');

  if (!file) {
    document.body.innerHTML = '<div id="err">Chybí ?file= parametr.</div>';
    return;
  }
  const side    = file + '.redline.t2l';
  const sideOld = file + '.redline.json';   // pre-t2l markup, read-only

  const STROKE = 'rgba(168, 85, 247, 0.85)';   // fialová
  const FILL   = 'rgba(168, 85, 247, 0.10)';
  const WIDTH  = 4;

  // A click without a drag must not leave an invisible speck in the sidecar
  // that only undo could explain. Same threshold for both meanings: the short
  // side of a rectangle, and the step between two recorded freehand points.
  const MIN = 0.004;

  let shapes  = [];      // committed: {type:'rect',x,y,w,h} | {type:'line'|'polyline',points:[{x,y}]}
  let draft   = null;    // shape under the mouse right now (rect / freehand)
  let pending = null;    // polyline being clicked out, not committed yet
  let cursor  = null;    // last known pointer, for the polyline rubber band
  let mode    = 'rect';
  let fs = null;

  // The picture is set once the bridge tells us which file to load: it may be
  // `file` itself, or `file + '.orig'` if a save has already baked shapes in.

  // ---- painting ---------------------------------------------------------
  function fit() {
    // Canvas covers exactly the rendered image box; the backing store is in
    // device pixels so the strokes stay sharp on a hidpi screen.
    const w = $pic.clientWidth, h = $pic.clientHeight;
    if (!w || !h) return;
    const dpr = window.devicePixelRatio || 1;
    $ink.style.width = w + 'px';
    $ink.style.height = h + 'px';
    $ink.width  = Math.round(w * dpr);
    $ink.height = Math.round(h * dpr);
    draw();
  }

  // One painter for canvas and for export, so the preview cannot drift from
  // the PNG. Caller supplies the pixel box; everything else is the same.
  function paint(ctx, w, h, list, width) {
    ctx.lineWidth = width;
    ctx.strokeStyle = STROKE;
    ctx.fillStyle = FILL;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (const s of list) {
      if (!s) continue;
      if (s.type === 'rect') {
        ctx.fillRect(s.x * w, s.y * h, s.w * w, s.h * h);
        ctx.strokeRect(s.x * w, s.y * h, s.w * w, s.h * h);
      } else if (s.points && s.points.length > 1) {
        ctx.beginPath();
        ctx.moveTo(s.points[0].x * w, s.points[0].y * h);
        for (let i = 1; i < s.points.length; i++) {
          ctx.lineTo(s.points[i].x * w, s.points[i].y * h);
        }
        ctx.stroke();
      }
    }
  }

  function draw() {
    const ctx = $ink.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = $pic.clientWidth, h = $pic.clientHeight;
    ctx.clearRect(0, 0, w, h);

    // The pending polyline is drawn with a rubber band to the cursor, so the
    // next segment is visible before it is committed by a click.
    let band = null;
    if (pending && cursor) band = { type: 'polyline', points: pending.points.concat([cursor]) };

    paint(ctx, w, h, shapes.concat([draft, band || pending]), WIDTH);
    $count.textContent = shapes.length + (pending ? '+' : '');
  }

  // ---- input ------------------------------------------------------------
  function at(ev) {
    const b = $ink.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (ev.clientX - b.left) / b.width)),
      y: Math.min(1, Math.max(0, (ev.clientY - b.top) / b.height))
    };
  }

  function far(a, b) {
    // Freehand would otherwise record a point per mouse event, which bloats the
    // sidecar and gains nothing - the extra points are below a pixel apart.
    return Math.abs(a.x - b.x) > MIN || Math.abs(a.y - b.y) > MIN;
  }

  let anchor = null;
  $ink.addEventListener('mousedown', function (ev) {
    if (ev.button !== 0) return;
    ev.preventDefault();
    const p = at(ev);
    if (mode === 'polyline') {
      if (pending) pending.points.push(p);
      else pending = { type: 'polyline', points: [p] };
      cursor = p;
      draw();
      return;
    }
    anchor = p;
    draft = (mode === 'line')
      ? { type: 'line', points: [p] }
      : { type: 'rect', x: p.x, y: p.y, w: 0, h: 0 };
    draw();
  });

  window.addEventListener('mousemove', function (ev) {
    const p = at(ev);
    if (pending) { cursor = p; draw(); return; }
    if (!anchor) return;
    if (mode === 'line') {
      const pts = draft.points;
      if (far(pts[pts.length - 1], p)) pts.push(p);
    } else {
      draft = {
        type: 'rect',
        x: Math.min(anchor.x, p.x), y: Math.min(anchor.y, p.y),
        w: Math.abs(p.x - anchor.x), h: Math.abs(p.y - anchor.y)
      };
    }
    draw();
  });

  window.addEventListener('mouseup', function () {
    if (!anchor) return;
    anchor = null;
    const s = draft;
    draft = null;
    if (s && s.type === 'rect' && s.w > MIN && s.h > MIN) commit(s);
    else if (s && s.type === 'line' && s.points.length > 1) commit(s);
    draw();
  });

  // Right button ends the current polyline. Bound on the document, not on the
  // canvas: while clicking out a line it is easy to land just off the image,
  // and there the menu would open on top of the drawing and swallow the
  // gesture. This is a drawing surface, the context menu has nothing to offer.
  document.addEventListener('contextmenu', function (ev) {
    ev.preventDefault();
    endPending();
  });

  function commit(s) { shapes.push(s); save(); }

  function endPending() {
    if (!pending) return;
    const p = pending;
    pending = null;
    if (p.points.length > 1) commit(p);   // a single click is not a line
    draw();
  }

  // ---- buttons ----------------------------------------------------------
  const MODES = { 'm-rect': 'rect', 'm-line': 'line', 'm-poly': 'polyline' };
  const HINTS = {
    rect:     'táhni myší = obdélník · <b>Ctrl+Z</b> zpět · <b>save</b> přepíše obrázek (záloha <b>.orig</b>)',
    line:     'táhni myší = čára od ruky · <b>Ctrl+Z</b> zpět · <b>save</b> přepíše obrázek (záloha <b>.orig</b>)',
    polyline: 'klikej body · <b>pravé tlačítko</b> ukončí čáru · <b>Esc</b> zahodí rozdělanou'
  };

  function setMode(m) {
    // A half-drawn polyline is deliberate work, so switching mode keeps it
    // rather than dropping it silently. Esc is the way to throw it away.
    endPending();
    mode = m;
    for (const id in MODES) {
      document.getElementById(id).classList.toggle('on', MODES[id] === m);
    }
    note(HINTS[m]);
    draw();
  }
  for (const id in MODES) {
    document.getElementById(id).addEventListener('click', function () { setMode(MODES[id]); });
  }

  function undo() {
    // While a polyline is open, undo takes back the last click - that is the
    // step the user just made. Only once nothing is pending does it reach for
    // the last finished shape.
    if (pending) {
      pending.points.pop();
      if (!pending.points.length) pending = null;
    } else if (shapes.length) {
      shapes.pop();
      save();
    }
    draw();
  }

  document.addEventListener('keydown', function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') {
      ev.preventDefault(); undo();
    } else if (ev.key === 'Escape' && pending) {
      ev.preventDefault(); pending = null; draw();
    }
  });

  document.getElementById('undo').addEventListener('click', undo);

  document.getElementById('clear').addEventListener('click', function () {
    if (!shapes.length && !pending) return;
    shapes = [];
    pending = null;
    save();
    draw();
  });

  // ---- export -----------------------------------------------------------
  // The sidecar keeps the markup editable; this is the way *out* - the picture
  // on disk is overwritten with the composite, with a one-time `.orig` backup
  // preserved on the first save. Composed at the image's own resolution, not
  // at the size it happens to be shown at.
  document.getElementById('save').addEventListener('click', function () {
    if (!fs) { note('bridge není připojený', true); return; }
    const w = $pic.naturalWidth, h = $pic.naturalHeight;
    if (!w || !h) { note('obrázek není načtený', true); return; }

    endPending();   // an open polyline would otherwise be missing from the PNG

    const out = document.createElement('canvas');
    out.width = w;
    out.height = h;
    const ctx = out.getContext('2d');
    ctx.drawImage($pic, 0, 0, w, h);
    // Keep the stroke as thick relative to the picture as it looks on screen.
    const width = Math.max(WIDTH, Math.round(WIDTH * w / Math.max(1, $pic.clientWidth)));
    paint(ctx, w, h, shapes, width);

    fs.saveInPlace(file, out.toDataURL('image/png'), function (path) {
      if (!path) { note('save se nepovedl', true); return; }
      note('saved: <b>' + path.replace(/^.*\//, '') + '</b>');
    });
  });

  // ---- sidecar ----------------------------------------------------------
  function note(text, bad) {
    $hint.innerHTML = text;
    $hint.className = bad ? 'saving' : '';
  }

  // Markup is t2l, like everything else that carries meaning here: one record
  // per shape, typed by what it is. A JSON blob said `{"type":"rect","x":...}`
  // in a format nothing else in the tree reads, with no way to link back to the
  // picture it marks up. The record's `file:` does exactly that.

  // Six decimals on a 0..1 fraction is a thousandth of a pixel on a 4000px
  // image - past that the digits only make the file harder to read.
  function num(v) { return String(Math.round(v * 1e6) / 1e6); }

  function pair(v) {
    if (typeof v !== 'string') return null;
    const a = v.split(',').map(function (n) { return parseFloat(n); });
    if (a.length !== 2) return null;
    return (isFinite(a[0]) && isFinite(a[1])) ? a : null;
  }

  function toT2l(list) {
    const base = file.replace(/^.*\//, '');
    const out = [
      '#: redline markup pro ' + base,
      '#: souradnice jsou zlomky rozmeru obrazku (0-1), ne pixely',
      '',
      'type: redline',
      'file: [[file:' + base + ']]',
      'version: 3',
      ''
    ];
    for (const s of list) {
      if (!s) continue;
      if (s.type === 'rect') {
        out.push('type: rectangle',
                 'pos: '  + num(s.x) + ',' + num(s.y),
                 'size: ' + num(s.w) + ',' + num(s.h));
      } else if (s.points && s.points.length) {
        out.push('type: ' + (s.type === 'line' ? 'line' : 'polyline'),
                 'points: ' + s.points.map(function (p) {
                   return num(p.x) + ',' + num(p.y);
                 }).join(' '));
      } else {
        continue;
      }
      out.push('');
    }
    return out.join('\n');
  }

  // Minimal t2l reader: `key: value` lines, blank line ends a record, `#:` is
  // a comment. Repeated keys are not used here, so the last one simply wins.
  function parseT2l(text) {
    const records = [];
    let cur = null;
    for (const raw of text.split(/\r?\n/)) {
      const line = raw.trim();
      if (!line) { cur = null; continue; }
      if (line.charAt(0) === '#') continue;
      const i = line.indexOf(':');
      if (i < 0) continue;
      if (!cur) { cur = {}; records.push(cur); }
      cur[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    }
    return records;
  }

  function fromT2l(text) {
    const out = [];
    for (const r of parseT2l(text)) {
      if (r.type === 'rectangle') {
        const p = pair(r.pos), d = pair(r.size);
        if (p && d) out.push({ type: 'rect', x: p[0], y: p[1], w: d[0], h: d[1] });
      } else if (r.type === 'line' || r.type === 'polyline') {
        const pts = [];
        for (const tok of String(r.points || '').split(/\s+/)) {
          const a = pair(tok);
          if (a) pts.push({ x: a[0], y: a[1] });
        }
        if (pts.length) out.push({ type: r.type, points: pts });
      }
    }
    return out;
  }

  function save() {
    if (!fs) return;
    fs.write(side, toT2l(shapes), function (ok) {
      if (!ok) note('nelze zapsat ' + side + ' (mimo sandbox?)', true);
    });
  }

  function load() {
    if (!fs) return;
    fs.read(side, function (text) {
      if (text && text.trim()) {
        shapes = fromT2l(text);
        draw();
        return;
      }
      loadLegacy();
    });
  }

  // Pictures marked up before the switch still have a .json next to them. It is
  // read once and converted in memory; the file is not rewritten and not
  // deleted here, because merely opening an image must not change the disk. The
  // next actual edit writes the t2l and the .json is then stale - Petr's to bin.
  function loadLegacy() {
    fs.read(sideOld, function (text) {
      if (!text) { draw(); return; }
      try {
        const data = JSON.parse(text);
        const list = (data && Array.isArray(data.shapes)) ? data.shapes
                   : (data && Array.isArray(data.rects))
                     ? data.rects.map(function (r) {
                         return { type: 'rect', x: r.x, y: r.y, w: r.w, h: r.h };
                       })
                     : [];
        shapes = list;
        if (list.length) note('načteno z ' + sideOld.replace(/^.*\//, '') +
                              ' - uloží se jako .redline.t2l');
      } catch (e) {
        note('poškozený ' + sideOld, true);
      }
      draw();
    });
  }

  $pic.addEventListener('load', fit);
  $pic.addEventListener('error', function () {
    document.body.innerHTML = '<div id="err">Nelze načíst obrázek: ' + file + '</div>';
  });
  window.addEventListener('resize', fit);

  setMode('rect');

  if (window.__chroma && window.__chroma.ready) {
    window.__chroma.ready.then(function (bridge) {
      fs = bridge;
      fs.origOf(file, function (bg) {
        $pic.src = 'file://' + (bg || file);
        load();
      });
    });
  }
})();
</script>
</body>
</html>
